[defaults]
roles_path       = ./roles
collections_path = ./.collections
inventory        = ./inventory
retry_files_enabled = false
interpreter_python  = auto_silent
nocows           = true
# Native YAML-formatted task results (ansible-core 2.13+), replacing the
# removed community.general.yaml stdout callback.
callback_result_format = yaml

[inventory]
enable_plugins = host_list, yaml, ini

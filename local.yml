---
- name: Configure this machine
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Fail loudly if this host has no valid profile
      ansible.builtin.assert:
        that:
          - profile is defined
          - profile in profiles
        fail_msg: >-
          No valid 'profile' for {{ inventory_hostname }}. Define it in
          host_vars/{{ inventory_hostname }}.yml as one of:
          {{ profiles.keys() | list | join(', ') }}.
        quiet: true

  tasks:
    - name: Apply the roles for the selected profile
      ansible.builtin.include_role:
        name: "{{ role_name }}"
      loop: "{{ profiles[profile] }}"
      loop_control:
        loop_var: role_name

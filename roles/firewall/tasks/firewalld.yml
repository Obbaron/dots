---
# On Fedora Server firewalld ships enabled with a default zone that already
# rejects unsolicited incoming traffic, so the backend's whole job is to ensure
# it's installed and running — no explicit deny rules ("use the default").
- name: Install firewalld
  ansible.builtin.package:
    name: firewalld
    state: present
  become: true

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  become: true

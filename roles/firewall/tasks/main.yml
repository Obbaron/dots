---
- name: Select the firewall backend
  ansible.builtin.set_fact:
    firewall_backend: >-
      {{ firewall_backend
         | default(firewall_default_backend[ansible_facts['os_family']]
                   | default('unsupported')) }}
  vars:
    firewall_default_backend:
      Archlinux: ufw
      RedHat: firewalld

- name: Fail if no firewall backend fits this host
  ansible.builtin.assert:
    that:
      - firewall_backend in ['ufw', 'firewalld']
    fail_msg: >-
      No firewall backend for os_family={{ ansible_facts['os_family'] }}.
      Set firewall_backend (ufw|firewalld) in host_vars to choose one.
    quiet: true

- name: "Apply the {{ firewall_backend }} backend"
  ansible.builtin.include_tasks: "{{ firewall_backend }}.yml"

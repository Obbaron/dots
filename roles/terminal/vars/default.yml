---
# The "nicer interactive stack". starship is intentionally NOT here — it's
# installed via its official script in tasks/main.yml, since distro packaging
# for it is unreliable. Clean on Arch; add an os_family override for any
# Debian/Fedora workstation where a name differs.
terminal_packages:
  - eza
  - zoxide
  - yazi
  - fastfetch
